experiment:
  num_agents: 50
  num_locations: 2
  blue_env_lambda: 0.00005
  red_env_lambda_easy: 0.0001
  red_env_lambda_hard: 6.666666666666667e-5
  difficulties: ["easy", "hard"]
  travel_time: 10
  quorum_threshold: 0.7
  gamma_epsilon: 0.01
  # (!) timesteps, not agent steps
  max_steps: 8e6
  test_run_name: "my_policy_checkpoint-0"
  load_checkpoint: false
  # Modes: test     -  compares given policy against baseline
  #        train    -  trains a new or existing policy
  #        baseline -  runs a given baseline
  mode: "train"
  training_iterations: 800
  eval_iterations: 500
  baseline_algos: ["DMMD", "DMMD_bel_share"]
  base_seed: 462
  entropy_coeff: 0.014
  clip_param: 0.2
  vf_clip_param: 10.0
  prior_beta_0: 4000.0
  prior_alpha_0: 1.0

rewards:
  reward_for_correct_decision: 20
  reward_for_wrong_decision: -35
  reward_for_timeout: -40
  r_uncert_amp: 12.66
  r_explore_time_amp: 1.41
  r_vote_amp: 8.65
  solved_bonus_time_decay: 5e-7
  settings:
    r_vote_enabled: false
    r_uncert_enabled: true
    r_explore_time_enabled: false

testing:
  agents: [10, 50, 100, 200, 500, 1000]
  episodes: [10, 20, 50, 100, 500, 800, 1000, 2000]
  locations: [2, 10, 50, 100]

hardware:
  num_cpus: 64
