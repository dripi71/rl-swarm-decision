experiment:
  num_agents: 1
  num_locations: 2
  lambda_min: 0.1
  lambda_max: 1
  blue_env_lambda: 0.00005
  red_env_lambda_easy: 0.0001
  red_env_lambda_hard: 6.666666666666667e-5
  current_hardness: "easy"
  travel_time: 10
  quorum_threshold: 0.7
  gamma_epsilon: 0.01
  # (!) timesteps, not agent steps
  max_steps: 1e5
  min_sampling_duration: 100
  test_run_name: "run_Easy_sanity_checkpoint-0"
  training: true
  compare: false
  load_checkpoint: false
  training_iterations: 400
  eval_iterations: 5
  base_seed: 462
  entropy_coeff: 0.005

compare_policies:
  policy_a_path: "run_Easy_major_reward_update_checkpoint-100"
  policy_b_path: "run_Easy_major_reward_update_checkpoint-650"


rewards:
  reward_per_event: 0.1
  reward_for_correct_decision: 30
  reward_for_wrong_decision: -50
  reward_for_timeout: -100
  decision_cost: 0.0
  # 1e7, 1e7 * 5e-6 = 50
  # solving bonus: solved_reward - steps * solved_bonus_time_decay 
  # The solving bonus should be >=0 when reaching max steps, otherwise it penalizes correct solving
  solved_bonus_time_decay: 5e-7
  progress_bonus: 10

testing:
  agents: [10,20,30,40,50,100,200,500, 1000, 2000, 5000, 10000]
  episodes: [10, 20, 50, 100, 500, 1000, 2000, 5000, 10000, 50000]
  locations: [2,3,4,5,10,20,50,100]
