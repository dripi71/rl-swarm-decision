experiment:
  num_agents: 50
  num_locations: 2
  lambda_min: 0.1
  lambda_max: 1
  blue_env_lambda: 0.00005
  red_env_lambda_easy: 0.0001
  red_env_lambda_hard: 6.666666666666667e-5
  current_hardness: "easy"
  travel_time: 10
  quorum_threshold: 0.7
  gamma_epsilon: 0.01
  # (!) timesteps, not agent steps
  max_steps: 1e6
  test_run_name: "run_Easy_dc_checkpoint-800"
  training: false
  load_checkpoint: true
  training_iterations: 800
  eval_iterations: 1
  base_seed: 462

rewards:
  reward_per_event: 0.0
  reward_for_correct_decision: 10
  reward_for_wrong_decision: -50
  decision_cost: -0.005
  # 1e7, 1e7 * 5e-6 = 50
  # solving bonus: solved_reward - steps * solved_bonus_time_decay 
  # The solving bonus should be >=0 when reaching max steps, otherwise it penalizes correct solving
  solved_bonus_time_decay: 1e-6
  progress_bonus: 1

testing:
  agents: [10,20,30,40,50,100,200,500, 1000, 2000, 5000, 10000]
  episodes: [10, 20, 50, 100, 500, 1000, 2000, 5000, 10000, 50000]
  locations: [2,3,4,5,10,20,50,100]
