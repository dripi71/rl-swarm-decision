experiment:
  num_agents: 50
  num_locations: 2
  blue_env_lambda: 0.00005
  red_env_lambda_easy: 0.0001
  red_env_lambda_hard: 6.666666666666667e-5
  current_hardness: "easy"
  travel_time: 10
  quorum_threshold: 0.7
  gamma_epsilon: 0.01
  # (!) timesteps, not agent steps
  max_steps: 8e6
  min_sampling_duration: 100
  test_run_name: "run_Easy_mso_s_50_lower_entropy_checkpoint-600"
  load_checkpoint: true
  # Modes: test     -  compares given policy against baseline
  #        train    -  trains a new or existing policy
  #        compare  -  compares two policies against eachother
  #        baseline -  runs a given baseline
  mode: "test"
  training_iterations: 800
  eval_iterations: 500
  baseline_algo: "DMMD"
  base_seed: 462
  entropy_coeff: 0.01
  clip_param: 0.2
  vf_clip_param: 10.0
  #old prior beta: 10000.0
  prior_beta_0: 4000.0
  prior_alpha_0: 1.0

compare_policies:
  policy_a_path: "run_Easy_major_reward_update_checkpoint-100"
  policy_b_path: "run_Easy_major_reward_update_checkpoint-650"

rewards:
  reward_for_correct_decision: 20
  reward_for_wrong_decision: -35
  reward_for_timeout: -40
  r_uncert_amp: 20
  r_explore_time_amp: 0.6
  r_vote_amp: 1.0
  # 1e7, 1e7 * 5e-6 = 50
  # solving bonus: solved_reward - steps * solved_bonus_time_decay
  # The solving bonus should be >=0 when reaching max steps, otherwise it penalizes correct solving
  solved_bonus_time_decay: 5e-7

testing:
  agents: [10, 50, 100, 200, 500, 1000, 2000]
  episodes: [10, 20, 50, 100, 500, 800, 1000, 2000]
  locations: [2, 10, 50, 100]
